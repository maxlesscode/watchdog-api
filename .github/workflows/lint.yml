name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet github.com/maxlesscode/watchdog/internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.1

      - name: Build
        run: >
          go build
          -trimpath
          -ldflags "-X main.version=${{ github.sha }}"
          ./cmd/watchdog/...
